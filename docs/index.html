<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ВасяGPT — ИИ-помощник</title>
  <meta name="description" content="Веб-интерфейс VasyaGPT: чат с Gemini, Vision, LaTeX, подсветка кода и генерация изображений." />
  <link rel="icon" type="image/png" href="avatar.png" />
  <link rel="apple-touch-icon" href="avatar.png" />

  <!-- Highlight.js (тёмная и светлая темы) -->
  <link id="hljs-theme-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <link id="hljs-theme-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" disabled />

  <!-- KaTeX (математические формулы) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

  <!-- Стили приложения -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Затемнение фона для мобильного сайдбара -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Выдвижной сайдбар с историей чатов -->
    <aside id="sidebar" class="sidebar" aria-label="История чатов">
      <div class="sidebar-header">
        <div class="brand">
          <img src="avatar.png" alt="ВасяGPT" class="vasya-avatar" />
          <span class="brand-name">ВасяGPT</span>
        </div>
        <button id="sidebar-close-btn" class="icon-btn mobile-only" type="button" title="Закрыть панель" aria-label="Закрыть панель">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="sidebar-actions">
        <button id="new-chat-btn" class="new-chat-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Новый чат</span>
        </button>
      </div>

      <div class="sidebar-section-label">История чатов</div>
      <nav id="chat-list" class="chat-list" aria-label="Список чатов"></nav>

      <div class="sidebar-footer">
        <button id="theme-toggle-sidebar" class="sidebar-footer-btn" type="button">
          <span id="theme-icon-sidebar" aria-hidden="true">☀️</span>
          <span id="theme-label-sidebar">Светлая тема</span>
        </button>
      </div>
    </aside>

    <!-- Основная область -->
    <main class="main-container">
      <!-- Верхняя панель -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle-btn" class="icon-btn" type="button" title="Меню чатов" aria-label="Открыть или скрыть меню чатов">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
          <div class="topbar-title-wrap">
            <h1 id="current-chat-title" class="topbar-title">Новый чат</h1>
          </div>
        </div>

        <div class="topbar-right">
          <div class="thinking-switcher" role="group" aria-label="Уровень размышлений">
            <button type="button" class="thinking-btn" data-level="LOW" title="Быстрый ответ (LOW)">⚡ <span>Быстрый</span></button>
            <button type="button" class="thinking-btn active" data-level="MEDIUM" title="Сбалансированный режим (MEDIUM)">⚖️ <span>Обычный</span></button>
            <button type="button" class="thinking-btn" data-level="HIGH" title="Глубокий анализ (HIGH)">🧠 <span>Глубокий</span></button>
          </div>

          <button id="theme-toggle-btn" class="icon-btn" type="button" title="Переключить тему" aria-label="Переключить тему">
            <span id="theme-icon-header">☀️</span>
          </button>
        </div>
      </header>

      <!-- Лента сообщений -->
      <section id="chat-messages" class="chat-messages" aria-live="polite">
        <!-- Приветственный экран (скрывается при появлении сообщений) -->
        <div id="welcome-screen" class="welcome-screen">
          <div class="welcome-badge">
            <img src="avatar.png" alt="ВасяGPT" class="vasya-avatar" />
            <span>ВасяGPT</span>
          </div>
          <h2 class="welcome-heading">Чем помочь сегодня?</h2>
          <p class="welcome-sub">Умный помощник Вася: код с подсветкой, формулы LaTeX, анализ изображений и генерация картинок.</p>

          <div class="starter-grid">
            <button type="button" class="starter-card" data-prompt="Напиши чистый пример быстрой сортировки на Python с комментариями на русском и оценкой сложности.">
              <span class="starter-icon">💻</span>
              <span class="starter-title">Код на Python</span>
              <span class="starter-desc">Алгоритмы с подсветкой и комментариями</span>
            </button>
            <button type="button" class="starter-card" data-prompt="Выведи и объясни формулу корней квадратного уравнения и теорему Виета с примером решения.">
              <span class="starter-icon">📐</span>
              <span class="starter-title">Математика и LaTeX</span>
              <span class="starter-desc">Красивые формулы и пошаговый разбор</span>
            </button>
            <button type="button" class="starter-card" data-prompt="Составь подробный план изучения JavaScript и TypeScript с нуля за 4 недели в виде таблицы.">
              <span class="starter-icon">📚</span>
              <span class="starter-title">План обучения</span>
              <span class="starter-desc">Структурированные таблицы и списки</span>
            </button>
            <button type="button" class="starter-card" data-image-prompt="futuristic cozy cyberpunk library with glowing neon holograms, ultra detailed, cinematic lighting">
              <span class="starter-icon">🎨</span>
              <span class="starter-title">Создать картинку</span>
              <span class="starter-desc">Генерация через Flux-1 по описанию</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Панель ввода -->
      <footer class="composer-wrapper">
        <div class="composer-inner">
          <!-- Превью прикреплённого фото -->
          <div id="attachment-preview" class="attachment-preview hidden">
            <div class="attachment-thumb-wrap">
              <img id="attachment-thumb" src="" alt="Предпросмотр фото" />
              <button id="remove-attachment-btn" class="remove-attachment-btn" type="button" title="Удалить фото" aria-label="Удалить фото">×</button>
            </div>
            <span id="attachment-info" class="attachment-info">Изображение готово к отправке</span>
          </div>

          <form id="chat-form" class="composer-box">
            <input id="image-file-input" type="file" accept="image/*" hidden />

            <button id="attach-btn" class="composer-tool-btn" type="button" title="Прикрепить фото (Vision)" aria-label="Прикрепить фото">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>

            <button id="image-mode-btn" class="composer-mode-btn" type="button" title="Режим генерации изображений" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg>
              <span>Картинка</span>
            </button>

            <textarea
              id="prompt-input"
              class="prompt-input"
              rows="1"
              placeholder="Напишите сообщение Васе..."
              aria-label="Поле ввода сообщения"
            ></textarea>

            <button id="send-btn" class="send-btn" type="submit" title="Отправить" aria-label="Отправить сообщение">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>

            <button id="stop-btn" class="stop-btn hidden" type="button" title="Остановить генерацию" aria-label="Остановить генерацию">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              <span>Стоп</span>
            </button>
          </form>

          <p class="composer-hint">
            Enter — отправить, Shift+Enter — новая строка. Поддерживаются Markdown, LaTeX, Vision и генерация картинок.
          </p>
        </div>
      </footer>
    </main>
  </div>

  <!-- Библиотеки через CDN: marked, DOMPurify, highlight.js, KaTeX + auto-render -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Логика приложения -->
  <script src="app.js"></script>
</body>
</html>
